{% extends "base.html" %}
{% set editing = sponsorship is not none %}
{% block title %}{{ 'Edit' if editing else 'Add' }} Sponsorship | EventOps AI{% endblock %}
{% block content %}
<section class="container-xl" style="max-width: 840px;"><a class="small text-decoration-none" href="{{ url_for('admin_sponsorships') }}"><i class="bi bi-arrow-left me-1"></i>Sponsorships</a><div class="card border-0 shadow-sm mt-3"><div class="card-body p-4 p-md-5"><h1 class="h2 fw-bold">{{ 'Edit sponsorship' if editing else 'Add a sponsor' }}</h1>
<form method="POST" action="{{ url_for('admin_sponsorship_edit', sponsorship_id=sponsorship.id) if editing else url_for('admin_sponsorship_add') }}" class="row g-3 mt-2">
    <div class="col-md-6"><label class="form-label fw-semibold" for="sponsor-name">Sponsor name</label><input class="form-control" id="sponsor-name" name="sponsor_name" maxlength="100" value="{{ sponsorship.sponsor_name if editing else '' }}" required></div>
    <div class="col-md-6"><label class="form-label fw-semibold" for="commitment">Commitment</label><input class="form-control" id="commitment" name="commitment" maxlength="200" value="{{ sponsorship.commitment if editing and sponsorship.commitment else '' }}" placeholder="e.g. $25,000"></div>
    <div class="col-12"><label class="form-label fw-semibold" for="deliverables">Deliverables</label><textarea class="form-control" id="deliverables" name="deliverables" rows="3">{{ sponsorship.deliverables if editing and sponsorship.deliverables else '' }}</textarea></div>
    <div class="col-md-6"><label class="form-label fw-semibold" for="visibility-score">Visibility score</label><input class="form-control" id="visibility-score" name="visibility_score" type="number" min="0" max="100" value="{{ sponsorship.visibility_score if editing else 0 }}"></div>
    <div class="col-md-6"><label class="form-label fw-semibold" for="roi">ROI</label><input class="form-control" id="roi" name="roi" type="number" min="0" step="0.01" value="{{ sponsorship.roi if editing else 0 }}"></div>
    <div class="col-12"><button class="btn btn-primary" type="submit">{{ 'Save changes' if editing else 'Create sponsorship' }}</button><a class="btn btn-link" href="{{ url_for('admin_sponsorships') }}">Cancel</a></div>
</form></div></div></section>
{% endblock %}
