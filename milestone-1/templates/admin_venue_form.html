<!--suppress HtmlUnknownTarget -->
{% extends "base.html" %}
{% set editing = venue is not none %}
{% block title %}{{ 'Edit' if editing else 'Add' }} Venue | EventOps AI{% endblock %}
{% block content %}
<section class="container-xl" style="max-width: 840px;"><a class="small text-decoration-none" href="{{ url_for('admin_venues') }}"><i class="bi bi-arrow-left me-1"></i>Venues</a><div class="card border-0 shadow-sm mt-3"><div class="card-body p-4 p-md-5"><h1 class="h2 fw-bold">{{ 'Edit venue' if editing else 'Add a venue' }}</h1>
<form method="POST" action="{{ url_for('admin_venue_edit', venue_id=venue.id) if editing else url_for('admin_venue_add') }}" class="row g-3 mt-2">
    <div class="col-md-6"><label class="form-label fw-semibold" for="name">Venue name</label><input class="form-control" id="name" name="name" maxlength="100" value="{{ venue.name if editing else '' }}" required></div>
    <div class="col-md-6"><label class="form-label fw-semibold" for="capacity">Capacity</label><input class="form-control" id="capacity" name="capacity" type="number" min="1" value="{{ venue.capacity if editing and venue.capacity else '' }}"></div>
    {% if editing %}
    <div class="col-md-6"><label class="form-label fw-semibold" for="utilization">Utilization (0–1)</label><input class="form-control" id="utilization" name="utilization" type="number" min="0" max="1" step="0.01" value="{{ venue.utilization if venue.utilization is not none else 0 }}"></div>
    <div class="col-md-6">
        <label class="form-label fw-semibold" for="status">Status</label>
        <select class="form-select" id="status" name="status">
            {% if venue.status == 'available' %}
            <option value="available" selected>Available</option>
            {% else %}
            <option value="available">Available</option>
            {% endif %}
            {% if venue.status == 'reserved' %}
            <option value="reserved" selected>Reserved</option>
            {% else %}
            <option value="reserved">Reserved</option>
            {% endif %}
            {% if venue.status == 'maintenance' %}
            <option value="maintenance" selected>Maintenance</option>
            {% else %}
            <option value="maintenance">Maintenance</option>
            {% endif %}
        </select>
    </div>
    {% endif %}
    <div class="col-12"><button class="btn btn-primary" type="submit">{{ 'Save changes' if editing else 'Create venue' }}</button><a class="btn btn-link" href="{{ url_for('admin_venues') }}">Cancel</a></div>
</form></div></div></section>
{% endblock %}
